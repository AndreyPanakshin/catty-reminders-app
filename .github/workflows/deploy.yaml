name: Deploy
on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          username: admin
          port: 3176
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/admin/catty-reminders-app
            
            DEPLOY_REF="${{ github.sha }}"
            
            cat > .env << ENVEOF
DB_CONTAINER_NAME=catty-db
MARIADB_ROOT_PASSWORD=mypass
MARIADB_USER=root
MARIADB_PASSWORD=mypass
MARIADB_DATABASE=catty_reminders
HOST_DB_PORT=3306
CONTAINER_DB_PORT=3306
APP_CONTAINER_NAME=catty-app
IMAGE=ghcr.io/andreypanakshin/catty-reminders-app:${DEPLOY_REF}
DEPLOY_REF=${DEPLOY_REF}
HOST_APP_PORT=8181
CONTAINER_APP_PORT=8181
ENVEOF

            export $(cat .env | xargs)
            
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u andreypanakshin --password-stdin
            
            docker compose pull catty-app
            docker compose up -d --no-deps --force-recreate catty-app
            
            sleep 15
            curl -s -o /dev/null -w "%{http_code}" http://localhost:8181/ | grep -q "200\|302" || exit 1
            echo "Deployment successful"
