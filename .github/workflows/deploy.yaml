name: CD
on:
  release:
    types: [created]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build (install dependencies on Runner)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1
        with:
  …stall dependencies
            /home/admin/catty-reminders-app/venv/bin/pip install -r requirements.txt
            
            # Get current SHA after reset
            CURRENT_SHA=$(git rev-parse HEAD)
            
            # Update deploy ref file
            echo "DEPLOY_REF=${CURRENT_SHA}" | sudo tee /etc/catty-app-env
            
            # Restart application
            sudo systemctl restart catty-reminders
            
            echo "✅ Deployed ${TAG_NAME} -> ${CURRENT_SHA}"
