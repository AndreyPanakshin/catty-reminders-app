name: CD
on:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: course.prafdin.ru
          port: 3176
          username: admin
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/admin/catty-reminders-app
            git fetch origin
            git reset --hard ${{ github.sha }}
            /home/admin/catty-reminders-app/venv/bin/pip install -r requirements.txt
            echo "DEPLOY_REF=${{ github.sha }}" | sudo tee /etc/catty-app-env
            sudo systemctl restart catty-reminders
