name: Deploy
on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          username: admin
          port: 3176
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/admin/catty-reminders-app
            
            DEPLOY_REF="${{ github.sha }}"
… # Логин в GHCR с персональным токеном
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u andreypanakshin --password-stdin
            
            # Pull и деплой
            docker compose pull catty-app
            docker compose up -d --no-deps --force-recreate catty-app
            
            # Проверка
            sleep 15
            curl -s -o /dev/null -w "%{http_code}" http://localhost:8181/ | grep -q "200\|302" || exit 1
            echo "✅ Deployment successful"
